name: OpenBVE Windows build test

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2
      - name: Restore packages
        run: nuget restore OpenBVE.sln -NonInteractive
      - name: Build OpenBVE main executable (Release AnyCPU)
        shell: pwsh
        run: |
          msbuild 'source\OpenBVE\OpenBve.csproj' /m /t:Build /p:Configuration=Release /p:Platform=AnyCPU /verbosity:minimal /bl:openbve-build.binlog
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Collect OpenBVE main executable and dependencies
        shell: pwsh
        run: |
          $outDir = Join-Path $PWD 'bin_release'
          Write-Host "Expected output directory: $outDir"
          if (-not (Test-Path $outDir)) { throw 'bin_release directory is missing' }
          $exe = Join-Path $outDir 'OpenBve.exe'
          if (-not (Test-Path $exe)) {
            Get-ChildItem -Path $outDir -File | Select-Object Name,Length | Format-Table -AutoSize
            throw 'OpenBve.exe missing in bin_release'
          }
          New-Item -ItemType Directory -Force -Path 'build-output' | Out-Null
          Copy-Item -Path (Join-Path $outDir '*') -Destination 'build-output' -Recurse -Force
          Get-ChildItem -Path 'build-output' -Recurse -File | Select-Object FullName,Length | Out-File 'build-manifest.txt'
          Write-Host "OpenBve.exe found: $exe"
          Write-Host "Collected files: $((Get-ChildItem 'build-output' -Recurse -File).Count)"
      - name: Upload build output
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OpenBVE-Windows-Release-AnyCPU
          path: |
            build-output/
            build-manifest.txt
          if-no-files-found: error
      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OpenBVE-build-diagnostics
          path: |
            openbve-build.binlog
            build-manifest.txt
          if-no-files-found: warn
