name: OpenBVE Windows build test

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2
      - name: Restore packages
        run: nuget restore OpenBVE.sln -NonInteractive
      - name: Build required LBAHeader utility (Release AnyCPU)
        shell: pwsh
        run: |
          msbuild 'source\DevTools\LBAHeader\LBAHeader.csproj' /t:Build /p:Configuration=Release /p:Platform=AnyCPU /verbosity:minimal /bl:lbaheader-build.binlog
          if ($LASTEXITCODE -ne 0) { throw 'LBAHeader build failed' }
          $helper = 'bin_release\DevTools\LBAHeader.exe'
          if (-not (Test-Path $helper)) { throw "Required helper missing: $helper" }
          Write-Host "Built prerequisite: $helper"
      - name: Build OpenBVE main executable (Release AnyCPU)
        shell: pwsh
        run: |
          msbuild 'source\OpenBVE\OpenBve.csproj' /t:Build /p:Configuration=Release /p:Platform=AnyCPU /verbosity:minimal /bl:openbve-build.binlog
          if ($LASTEXITCODE -ne 0) { throw 'OpenBVE build failed' }
      - name: Collect OpenBVE main executable and dependencies
        shell: pwsh
        run: |
          $outDir = Join-Path $PWD 'bin_release'
          $exe = Join-Path $outDir 'OpenBve.exe'
          if (-not (Test-Path $exe)) { throw "Missing executable: $exe" }
          New-Item -ItemType Directory -Force -Path 'build-output' | Out-Null
          Copy-Item -Path (Join-Path $outDir '*') -Destination 'build-output' -Recurse -Force
          Get-ChildItem -Path 'build-output' -Recurse -File | Select-Object FullName,Length | Out-File 'build-manifest.txt'
          Write-Host "OpenBVE executable verified: $exe"
          Write-Host "Collected $((Get-ChildItem 'build-output' -Recurse -File).Count) files"
      - name: Upload build output
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OpenBVE-Windows-Release-AnyCPU
          path: |
            build-output/
            build-manifest.txt
          if-no-files-found: error
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OpenBVE-build-diagnostics
          path: |
            openbve-build.binlog
            lbaheader-build.binlog
            build-manifest.txt
          if-no-files-found: warn
